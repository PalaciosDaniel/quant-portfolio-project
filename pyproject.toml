[project]
name = "quant-portfolio-project"
version = "0.1.0"
description = "Development of a cross-sectional predictive factor model using Machine Learning integrated with an equity portfolio optimization framework. Rigorous out-of-sample econometric validation assessing statistical robustness, revealing alpha constraints and high beta sensitivity relative to the S&P 500."
authors = [
    {name = "Daniel Palacios",email = "dppeco2@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=3.0.5,<4.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "scipy (>=1.18.0,<2.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "yfinance (>=1.5.2,<2.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "lxml (>=6.1.1,<7.0.0)",
    "xgboost (>=3.4.1,<4.0.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "optuna (>=5.0.0,<6.0.0)",
    "statsmodels (>=0.15.0,<0.16.0)",
    "joblib (>=1.6.0,<2.0.0)",
    "shap (>=0.54.1,<0.55.0)",
    "pyarrow (>=26.0.0,<27.0.0)",
    "fastparquet (>=2026.9.0,<2027.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyterlab (>=4.6.4,<5.0.0)"
]
